# Quality gates for every PR (CLAUDE.md §2B / D-014): lint + typecheck + tests.
# A PR must be green before review. No failing or skipped tests.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://user:password@localhost:5432/tamkeen_test?schema=public
      REDIS_URL: redis://localhost:6379

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: tamkeen_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared types
        run: npm run build:types

      # The Prisma client is generated, not committed. Needed before typecheck.
      - name: Generate Prisma client
        run: npm run db:generate --workspace @tamkeen/api

      - name: Apply migrations
        run: npm run db:deploy --workspace @tamkeen/api

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Integration tests hit the real PostgreSQL service container above.
      - name: Integration tests (API)
        run: npm run test:e2e --workspace @tamkeen/api
