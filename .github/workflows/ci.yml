# Save this file at: .github/workflows/ci.yml
# Runs lint + typecheck + tests on every PR and push. Adjust the package
# manager / script names to match what Phase 0 sets up.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: tamkeen_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # cache: 'pnpm'   # uncomment if using pnpm

      # - name: Install pnpm
      #   uses: pnpm/action-setup@v4
      #   with:
      #     version: 9

      - name: Install dependencies
        run: npm ci   # or: pnpm install --frozen-lockfile

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/tamkeen_test?schema=public
          REDIS_URL: redis://localhost:6379
        run: npm test

  # NOTE: This workflow never deploys and never pushes to main.
  # Merges to main happen only via reviewed pull requests, approved by a human.
